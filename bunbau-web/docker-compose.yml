# BunBau — run with:  docker compose --env-file .env.local --profile dev up --build
services:
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    container_name: bunbau-dev
    ports:
      - "${DEV_PORT:-3000}:3000"
    env_file:
      - .env.local
    environment:
      - WATCHPACK_POLLING=true      # reliable hot reload on macOS bind mounts
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app                      # live source
      - node_modules:/app/node_modules   # container-native deps (shadows host folder)
      - next_cache:/app/.next

  prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    container_name: bunbau-prod
    ports:
      - "3001:3000"                 # prod preview on 3001 so it can run beside dev
    env_file:
      - .env.local
    restart: unless-stopped

volumes:
  node_modules:
  next_cache:
